# ==============================================================================
# kkhypr: Vulkan and Aquamarine GPU Isolation Environment
# Hardware Target: AMD Ryzen 5 7535HS (Radeon 680M) + NVIDIA RTX 2050 Mobile
# ==============================================================================

# Bind Aquamarine/DRM compositor explicitly to integrated AMD Radeon 680M primary (card1)
# Secondary dGPU remains card0.
AQ_DRM_DEVICES=/dev/dri/card1:/dev/dri/card0

# Filter Vulkan ICD loader to AMD Radeon driver only
# Prevents desktop GTK4/Libadwaita applications from probing the NVIDIA dGPU
VK_LOADER_DRIVERS_SELECT=*radeon*

# Hardware video acceleration and Mesa drivers
LIBVA_DRIVER_NAME=radeonsi
VDPAU_DRIVER=radeonsi
__GLX_VENDOR_LIBRARY_NAME=mesa
