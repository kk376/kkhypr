# Foot frontend for the Ghostty workflow, using tmux for tabs and panes.
# Default preset: 100% solid, fully opaque surfaces without compositor blur.

[main]
include=~/.config/foot/themes/noctalia
font=Fira Code:size=13, Symbols Nerd Font Mono:size=13
font-bold=Fira Code:weight=bold:size=13, Symbols Nerd Font Mono:size=13
font-italic=Fira Code:slant=italic:size=13, Symbols Nerd Font Mono:size=13
font-bold-italic=Fira Code:weight=bold:slant=italic:size=13, Symbols Nerd Font Mono:size=13
dpi-aware=no
selection-target=clipboard
shell=/usr/bin/tmux new-session
term=foot
initial-window-mode=windowed
title=foot
app-id=foot
pad=16x8x16x2

[colors-dark]
alpha=1.0
alpha-mode=matching
blur=no

[cursor]
style=beam
beam-thickness=3px
blink=yes
blink-rate=500

[scrollback]
lines=10000000

[security]
osc52=enabled

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[mouse-bindings]
selection-override-modifiers=Shift
clipboard-paste=none
primary-paste=none

[url]
launch=xdg-open ${url}
style=single
osc8-underline=always

[bell]
system=no
urgent=no
notify=no
visual=no
command-focused=no

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
show-urls-launch=Control+Shift+o
