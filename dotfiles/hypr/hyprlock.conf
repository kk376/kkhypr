# ==============================================================================
# kkhypr: hyprlock configuration
# ==============================================================================

$font = Monospace

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Time (Hours and Minutes)
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(242, 243, 244, 0.95)
    font_size = 86
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

# Date (Weekday, Month Day)
label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B %Y"
    color = rgba(192, 202, 245, 0.85)
    font_size = 20
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(122, 162, 247, 0.8) rgba(187, 154, 247, 0.8) 45deg
    inner_color = rgba(26, 27, 38, 0.85)
    font_color = rgba(242, 243, 244, 0.95)
    fade_on_empty = false
    placeholder_text = <span foreground="##a9b1d6">Enter Password</span>
    hide_input = false
    rounding = 10
    check_color = rgba(122, 162, 247, 0.9)
    fail_color = rgba(247, 118, 142, 0.9)
    fail_text = <span foreground="##f7768e">$FAIL ($ATTEMPTS)</span>
    position = 0, -40
    halign = center
    valign = center
}
