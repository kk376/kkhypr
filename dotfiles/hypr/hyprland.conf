# ==============================================================================
# kkhypr: Production Hyprland Configuration
# Hardware Target: AMD Ryzen 5 7535HS (Radeon 680M) + NVIDIA GeForce RTX 2050 Mobile
# Shell: Noctalia Desktop Shell v5
# Terminal: Ghostty
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Hardware & Multi-GPU Zero-Freeze Architecture
# ------------------------------------------------------------------------------
# Force Aquamarine/DRM to bind to the integrated AMD Radeon 680M (card1).
# The NVIDIA RTX 2050 (card0) remains secondary and sleeps in ACPI D3cold.
# Note: Aquamarine splits AQ_DRM_DEVICES on ':', so by-path PCI addresses with colons must not be used.
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0

# Prevent Vulkan ICD loader from scanning the sleeping NVIDIA card on desktop app launch.
# Eliminates the 2 to 3 second GTK4/Libadwaita application startup freeze.
env = VK_LOADER_DRIVERS_SELECT,*radeon*
env = LIBVA_DRIVER_NAME,radeonsi
env = VDPAU_DRIVER,radeonsi
env = __GLX_VENDOR_LIBRARY_NAME,mesa

# ------------------------------------------------------------------------------
# 2. Toolkit & Wayland Integration
# ------------------------------------------------------------------------------
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = XCURSOR_SIZE,28
env = HYPRCURSOR_SIZE,28

# XWayland fractional scale fix: prevent compositor upscaling, let toolkits handle DPI.
# Without this, XWayland apps (OnlyOffice, etc.) render at 1x and get blurry upscaling.
xwayland {
    force_zero_scaling = true
}
env = GDK_SCALE,1
env = QT_SCALE_FACTOR,1
env = PATH,$HOME/.local/bin:$HOME/.cargo/bin:$PATH

# ------------------------------------------------------------------------------
# 3. Monitor Setup
# ------------------------------------------------------------------------------
# Laptop primary eDP-1 display at native resolution and highest refresh rate.
# 1.25x fractional scale provides a comfortable 1536x864 equivalent UI space.
# Extra monitors fallback to preferred mode and auto position.
monitor = eDP-1, preferred, 0x0, 1.25
monitor = , preferred, auto, 1

# ------------------------------------------------------------------------------
# 4. Default Programs
# ------------------------------------------------------------------------------
$terminal = ghostty
$fileManager = nautilus
$browser = google-chrome
$menu = noctalia msg panel-toggle launcher
$clipboard = noctalia msg panel-toggle clipboard
$controlCenter = noctalia msg panel-toggle control-center
$editor = ~/.local/bin/zed
$code = code

# ------------------------------------------------------------------------------
# 5. Autostart Pipeline
# ------------------------------------------------------------------------------
# Synchronize environment to D-Bus and systemd user services
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE XDG_SESSION_CLASS VK_LOADER_DRIVERS_SELECT AQ_DRM_DEVICES LIBVA_DRIVER_NAME VDPAU_DRIVER __GLX_VENDOR_LIBRARY_NAME
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE XDG_SESSION_CLASS VK_LOADER_DRIVERS_SELECT AQ_DRM_DEVICES LIBVA_DRIVER_NAME VDPAU_DRIVER __GLX_VENDOR_LIBRARY_NAME
exec-once = systemctl --user start hyprland-session.target

# Authentication agent
exec-once = /usr/libexec/hyprpolkitagent

# Noctalia desktop shell (bar, launcher, notifications, widgets)
exec-once = noctalia

# Idle management daemon
exec-once = hypridle

# Wallpaper daemon
exec-once = hyprpaper

# Dynamic workspace compactor daemon
exec-once = ~/.config/hypr/scripts/compact_workspaces.py

# Enable caffeine by default (idle inhibitor)
exec-once = sh -c 'sleep 1 && noctalia msg caffeine-enable'

# ------------------------------------------------------------------------------
# 6. Look & Feel
# ------------------------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(1f2335aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.25
        vibrancy_darkness = 0.05
        noise = 0.02
        contrast = 0.95
        brightness = 0.90
        ignore_opacity = true
        new_optimizations = true
        popups = true
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(0a0a0fee)
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1
    bezier = snappy, 0.16, 1, 0.3, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 2.5, snappy, slide
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
    focus_on_activate = true
}

# ------------------------------------------------------------------------------
# 7. Input Configuration
# ------------------------------------------------------------------------------
input {
    kb_layout = us
    numlock_by_default = true
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        scroll_factor = 0.8
    }
}

gesture = 3, horizontal, workspace

# ------------------------------------------------------------------------------
# 8. Noctalia Layer & Window Rules
# ------------------------------------------------------------------------------
layerrule[namespace:noctalia.*] = blur
layerrule[namespace:noctalia.*] = ignorealpha 0.2
layerrule[namespace:noctalia.*] = blurpopups
layerrule[namespace:noctalia-bar-default] = blur
layerrule[namespace:noctalia-bar-default] = ignorealpha 0.2

# Floating utility rules
windowrule[class:org.pulseaudio.pavucontrol] = float
windowrule[class:nm-connection-editor] = float
windowrule[class:hyprpolkitagent] = float
windowrule[title:Open File] = float
windowrule[title:Save File] = float
windowrule[class:hyprland-dialog] = float

# ------------------------------------------------------------------------------
# 9. Keybindings
# ------------------------------------------------------------------------------
$mainMod = SUPER

# Applications
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, T, exec, $terminal
bind = $mainMod, space, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, C, exec, $code
bind = $mainMod, N, exec, $controlCenter
bind = $mainMod, B, exec, $browser
bind = $mainMod, Z, exec, $editor
bind = $mainMod SHIFT, C, exec, $clipboard
bind = $mainMod, Escape, exec, loginctl lock-session

# Window management
bind = $mainMod, Q, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = , F11, fullscreen, 0
bind = $mainMod, P, pseudo
bind = $mainMod, S, layoutmsg, togglesplit
bind = $mainMod SHIFT, M, exit

# Focus navigation (Vim & Arrow keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Window movement (Vim & Arrow keys)
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Workspaces 1 to 10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace 1 to 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Hardware keys: Audio & Brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshots
# Print: Area selection to clipboard
# Super + Print: Full screen to clipboard
# Super + Shift + Print: Full screen to file and clipboard
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh area
bind = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot.sh screen
bind = $mainMod SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh screen-save
bind = $mainMod SHIFT, Sys_Req, exec, ~/.config/hypr/scripts/screenshot.sh screen-save
