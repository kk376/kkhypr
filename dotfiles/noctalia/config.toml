[bar.default]
background_opacity = 0.74999998323619366
center = [ "clock", "notifications" ]
end = [ "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "session" ]
font_family = "JetBrains Mono"
font_weight = 400
margin_edge = 5
margin_ends = 10
start = [ "workspaces", "spacer_2", "tray", "spacer_3", "weather" ]
widget_spacing = 15

[location]
auto_locate = true

[lockscreen]
transition = [ "disc" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 645.60003662109375
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
avatar_path = "/home/kk376/code/portfolio/src/assets/github_avatar.jpg"
font_family = "Adwaita Sans"
polkit_agent = true
settings_expand_all_groups = true
settings_window_translucent = true
time_format = "{:%H:%M:%S}"

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    transparency_mode = "glass"

    [shell.screenshot]
    directory = "/home/kk376/Pictures/Screenshots"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    builtin_ids = [
        "btop",
        "gtk3",
        "gtk4",
        "hyprland",
        "kcolorscheme",
        "kitty",
        "starship"
    ]
    community_ids = [
        "vscode"
    ]

[wallpaper]
directory = "/home/kk376/Pictures/Wallpapers"
transition = [ "disc" ]

    [wallpaper.default]
    path = "/home/kk376/Pictures/Wallpapers/kath.jpg"

    [wallpaper.last]
    path = "/home/kk376/Pictures/Wallpapers/kath.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/kk376/Pictures/Wallpapers/kath.jpg"

[widget.battery]
display_mode = "graphic"

[widget.clock]
format = "%a %d %b %H:%M:%S"

[widget.spacer_2]
length = 30
type = "spacer"

[widget.spacer_3]
length = 30
type = "spacer"

[hooks]
colors_changed = [ "bash /home/kk376/.config/noctalia/scripts/on-colors-changed.sh" ]
