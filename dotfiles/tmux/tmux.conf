# Foot supplies the terminal; each Foot process starts its own tmux session.

# Shell and terminal capabilities
if-shell 'command -v fish >/dev/null 2>&1' 'set -g default-shell /usr/bin/fish'
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB:extkeys:cstyle:ccolour:clipboard:focus:hyperlinks:title"
set -s extended-keys on
set -s escape-time 0
set -g focus-events on
set -g history-limit 10000000

# Mouse, clipboard, and session lifetime
set -g mouse on
# Mouse selections use wl-copy directly; avoid racing OSC 52 with that pipe.
set -s set-clipboard off
set -s copy-command "wl-copy -n"
set -g destroy-unattached on

# Window and pane numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format '#{?#{!=:#{pane_current_command},fish},#{pane_current_command},#{b:pane_current_path}}'
set -g set-titles on
set -g set-titles-string '#W'

# Keep the fallback tmux prefix available alongside the Ghostty-style keys.
set -g prefix C-b
bind-key C-b send-prefix

# Scrollback and pane scrollbar
set -g copy-mode-position-format ""
set -g copy-mode-selection-style "bg=#444559,fg=#c4c5dd"
set -g pane-scrollbars modal
set -g pane-scrollbars-position right
set -g pane-scrollbars-style "bg=default,fg=#bcc2ff,width=1,pad=0"
set -g mode-keys emacs
unbind-key -q -T copy-mode C-b
unbind-key -q -T copy-mode C-r
unbind-key -q -T copy-mode C-s
unbind-key -q -T copy-mode C-w
unbind-key -q -T copy-mode q
unbind-key -q -T copy-mode-vi C-b
unbind-key -q -T copy-mode-vi C-r
unbind-key -q -T copy-mode-vi C-s
unbind-key -q -T copy-mode-vi C-w
unbind-key -q -T copy-mode-vi q
bind-key -T copy-mode Any send-keys -X cancel \; send-keys -K
bind-key -T copy-mode-vi Any send-keys -X cancel \; send-keys -K

# Keep selections highlighted and copy them to Wayland on release, matching
# Ghostty's copy-on-select behavior. Shift-drag in Foot remains native selection.
bind-key -T copy-mode MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind-key -T copy-mode-vi MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear 'wl-copy -n'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear 'wl-copy -n'
bind-key -T copy-mode MouseDown1Pane if-shell -F "#{selection_present}" "send-keys -X copy-pipe-no-clear 'wl-copy -n'" "select-pane"
bind-key -T copy-mode-vi MouseDown1Pane if-shell -F "#{selection_present}" "send-keys -X copy-pipe-no-clear 'wl-copy -n'" "select-pane"
bind-key -T root DoubleClick1Pane select-pane -t = \; copy-mode -H \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear 'wl-copy -n'
bind-key -T root TripleClick1Pane select-pane -t = \; copy-mode -H \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear 'wl-copy -n'
bind-key -T copy-mode DoubleClick1Pane send-keys -X select-word \; send-keys -X copy-pipe-no-clear 'wl-copy -n'
bind-key -T copy-mode TripleClick1Pane send-keys -X select-line \; send-keys -X copy-pipe-no-clear 'wl-copy -n'
bind-key -T copy-mode-vi DoubleClick1Pane send-keys -X select-word \; send-keys -X copy-pipe-no-clear 'wl-copy -n'
bind-key -T copy-mode-vi TripleClick1Pane send-keys -X select-line \; send-keys -X copy-pipe-no-clear 'wl-copy -n'

# Scroll terminal history two lines at a time and leave copy mode as soon as
# scrolling returns to the live screen. Forward mouse events to full-screen
# applications that request them.
bind-key -T root WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "if-shell -F '#{alternate_on}' 'send-keys -N 2 Up' 'copy-mode -e -H; send-keys -X -N 2 scroll-up'"
bind-key -T root WheelDownPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "if-shell -F '#{alternate_on}' 'send-keys -N 2 Down' ''"
bind-key -T copy-mode WheelUpPane send-keys -X -N 2 scroll-up
bind-key -T copy-mode WheelDownPane if-shell -F "#{<=:#{copy_position},2}" "send-keys -X cancel" "send-keys -X -N 2 scroll-down"
bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 2 scroll-up
bind-key -T copy-mode-vi WheelDownPane if-shell -F "#{<=:#{copy_position},2}" "send-keys -X cancel" "send-keys -X -N 2 scroll-down"

bind-key -T copy-mode C-c send-keys -X cancel \; send-keys C-c
bind-key -T copy-mode-vi C-c send-keys -X cancel \; send-keys C-c
bind-key -T copy-mode Enter if-shell -F "#{selection_present}" "send-keys -X copy-pipe-and-cancel 'wl-copy -n'" "send-keys -X cancel \; send-keys Enter"
bind-key -T copy-mode-vi Enter if-shell -F "#{selection_present}" "send-keys -X copy-pipe-and-cancel 'wl-copy -n'" "send-keys -X cancel \; send-keys Enter"

# Right-click pastes without a trailing newline, as in Ghostty.
bind-key -T root MouseDown3Pane run-shell -b "wl-paste -n | tmux load-buffer - && tmux paste-buffer -p -d"
bind-key -T copy-mode MouseDown3Pane send-keys -X cancel \; run-shell -b "wl-paste -n | tmux load-buffer - && tmux paste-buffer -p -d"
bind-key -T copy-mode-vi MouseDown3Pane send-keys -X cancel \; run-shell -b "wl-paste -n | tmux load-buffer - && tmux paste-buffer -p -d"

# Bottom tab bar, styled to match the Ghostty Noctalia tabs.
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default"
set -g status-left ""
set -g status-right ""
set -g status-left-length 0
set -g status-right-length 0
set -g status-interval 1
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#18183c,bg=default]#[fg=#a6adc8,bg=#18183c] #{window_index} #{window_name} #[fg=#18183c,bg=default]"
setw -g window-status-current-format "#[fg=#a9aefe,bg=default]#[fg=#070722,bg=#a9aefe,bold] #{window_index} #{window_name} #[fg=#a9aefe,bg=default]"
bind-key -T root MouseDown1Status select-window -t =
bind-key -T root MouseDrag1Status swap-window -d -t =
bind-key -T root WheelUpStatus previous-window
bind-key -T root WheelDownStatus next-window
set -g message-style "bg=#a9aefe,fg=#070722,bold"
set -g mode-style "bg=#fff59b,fg=#070722"

# Hide the tab bar for one window, show it when a session has multiple tabs.
set -g status off
set-hook -g after-new-window 'if-shell -F "#{>:#{session_windows},1}" "set status on" "set status off"'
set-hook -g window-unlinked 'if-shell -F "#{>:#{session_windows},1}" "set status on" "set status off"'
set-hook -g client-attached 'if-shell -F "#{>:#{session_windows},1}" "set status on" "set status off"'

# Ghostty tab and pane controls
bind-key -n C-t new-window -c ~
bind-key -n C-S-t new-window -c ~
bind-key -n C-w kill-window
bind-key -n C-S-w kill-window

bind-key -n C-Tab next-window
bind-key -n C-S-Tab previous-window
bind-key -n C-S-Right next-window
bind-key -n C-S-Left previous-window
bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-S-Left swap-window -d -t -1
bind-key -n M-S-Right swap-window -d -t +1

# Ctrl+Shift+Enter opens another independent Foot/tmux session.
bind-key -n C-S-Enter run-shell -b "env -u TMUX -u TMUX_PANE foot >/dev/null 2>&1 &"

# Split creation and navigation
bind-key -n C-\\ split-window -h -c "#{pane_current_path}"
bind-key -n C-_ split-window -v -c "#{pane_current_path}"
bind-key -n C-S-[ select-pane -t :.-
bind-key -n C-S-] select-pane -t :.+

# Screen clearing and Ghostty's tab overview
bind-key -n C-l send-keys C-l \; clear-history
bind-key -n C-S-k send-keys C-l \; clear-history
bind-key -n C-S-a choose-tree -Zw
source-file -q "$HOME/.config/tmux/themes/noctalia.conf"
