# ==============================================================================
# ~/.config/tmux/tmux.conf
# Configured for Foot Terminal + Ghostty-style tabs + Noctalia theme
# Portable, hardware-agnostic, and clean
# ==============================================================================

# --- Theme & Colors ---

# --- Terminal Compatibility & Shell ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB:usstyle:sync"
set -as terminal-overrides ",foot*:Tc:XT"
set -g default-shell /usr/bin/fish
set -s escape-time 0
set -g focus-events on

# --- Lifecycle & Session Teardown ---
# Clean teardown: kill tmux session when window is closed (e.g. Super+q in Hyprland)
set -g destroy-unattached on

# --- History & Buffer ---
set -g history-limit 50000

# --- Mouse & Scrolling Optimization ---
set -g mouse on
setw -g mode-keys vi

# Native-like mouse wheel scrolling:
# 1. Passes mouse events directly to full-screen apps (less, vim, fzf, htop).
# 2. In normal shell, scrolls up directly into copy-mode.
# 3. Exits copy-mode automatically when you scroll back down to the prompt (-e flag).
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -et='"
bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' ''"

# Fast 5-line scrolling in copy mode
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down

# Autoscroll when mouse drag reaches status bar (bottom of window)
bind -n MouseDrag1Status if-shell -F "#{pane_in_mode}" "send-keys -X -N 5 scroll-down" ""
bind -n WheelUpStatus if-shell -F "#{pane_in_mode}" "send-keys -X -N 5 scroll-up" "previous-window"
bind -n WheelDownStatus if-shell -F "#{pane_in_mode}" "send-keys -X -N 5 scroll-down" "next-window"

# Copy & Paste (Matching Ghostty 1:1 with Wayland wl-clipboard)
# 1. Dragging with mouse copies immediately to clipboard without trailing newline
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "perl -pe 'chomp if eof' | wl-copy"
# 2. Double-click selects word & copies; Triple-click selects line & copies (trailing newline trimmed)
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "perl -pe 'chomp if eof' | wl-copy"
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "perl -pe 'chomp if eof' | wl-copy"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "perl -pe 'chomp if eof' | wl-copy"
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "perl -pe 'chomp if eof' | wl-copy"
# 3. Right-click pastes with bracketed paste (-p -r) and trailing newline stripped so Enter is NEVER pressed automatically
bind -n MouseDown3Pane run-shell "wl-paste -n | perl -pe 'chomp if eof' | tmux load-buffer - && tmux paste-buffer -p -r"
bind -T copy-mode-vi MouseDown3Pane send-keys -X cancel \; run-shell "wl-paste -n | perl -pe 'chomp if eof' | tmux load-buffer - && tmux paste-buffer -p -r"
# 4. Middle-click pastes primary selection with bracketed paste (-p -r) and trailing newline stripped
bind -n MouseDown2Pane run-shell "wl-paste -p -n | perl -pe 'chomp if eof' | tmux load-buffer - && tmux paste-buffer -p -r"
bind -T copy-mode-vi MouseDown2Pane send-keys -X cancel \; run-shell "wl-paste -p -n | perl -pe 'chomp if eof' | tmux load-buffer - && tmux paste-buffer -p -r"

# Native clipboard integration & keyboard copy
set -s set-clipboard on
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "perl -pe 'chomp if eof' | wl-copy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "perl -pe 'chomp if eof' | wl-copy"

# --- Ghostty-Style Tabs (Bottom Tab Bar) ---
set -g status-position bottom
set -g status-justify left
set -g status-left ""
set -g status-right "#[fg=#{@noctalia_outline}] %H:%M "

# 1-based indexing for tabs (so Alt+1 goes to Tab 1)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Clean tab styling
setw -g window-status-separator " "
setw -g window-status-format " #[fg=#{@noctalia_outline}]#I #[fg=#{@noctalia_on_surface_variant}]#W "
setw -g window-status-current-format " #[fg=#{@noctalia_primary},bold]#I #[fg=#{@noctalia_on_surface},bold]#W "

# New tab (matches Ghostty Ctrl+t) - always opens in home directory
bind -n C-t new-window -c "$HOME"
bind c new-window -c "$HOME"
bind '"' split-window -c "$HOME"
bind % split-window -h -c "$HOME"

# Tab switching (matches Ghostty Alt+1..9)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Tab navigation (matches Ghostty Alt+Right / Alt+Left)
bind -n M-Right next-window
bind -n M-Left previous-window

# Close tab (Alt+w)
bind -n M-w kill-window
source-file -q "$HOME/.config/tmux/themes/noctalia.conf"
