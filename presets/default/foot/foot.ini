[main]
# Always start with a new, independent tmux session
shell=/usr/bin/tmux new-session

# Fonts
font=FiraCode Nerd Font:size=13

include=~/.config/foot/themes/noctalia

[colors-dark]
alpha=1.0
blur=no

[colors-light]
alpha=1.0
blur=no

[mouse-bindings]
select-extend=none
clipboard-paste=BTN_RIGHT
primary-paste=BTN_MIDDLE
